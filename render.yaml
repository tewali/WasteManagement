# Render Blueprint — Phase 1 MVP deployment
# https://render.com/docs/blueprint-spec
#
# Deploys the Next.js app as a single Node web service. The MVP's JSON file
# store (.data/) lives on a persistent disk so documents and verifications
# survive deploys; it is replaced by Render Postgres in Phase 2 (see
# docs/PROPOSAL.md §4).
#
# Note: persistent disks require a paid instance type. To trial on the free
# tier, remove the `disk` block (data then resets on each deploy).

services:
  - type: web
    name: valli-spa-ai
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm run start # next start binds to Render's PORT env var
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 22.12.0
      # - key: ANTHROPIC_API_KEY   # Phase 1.1: real Claude extraction
      #   sync: false
    disk:
      name: valli-data
      mountPath: /opt/render/project/src/.data
      sizeGB: 1
